<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shreyash Bank</title>
<style>
  :root{
    --ledger: #F4EFE1;
    --ledger-line: #D8CFB4;
    --ink: #1F2A22;
    --forest: #17261E;
    --forest-2: #223629;
    --gold: #B08A3E;
    --gold-dim: #8C6F35;
    --red: #8C4A3A;
    --green-pos: #3D6B4F;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    --serif: 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: var(--forest);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(176,138,62,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(176,138,62,0.07), transparent 45%);
    font-family: var(--serif);
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: 40px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .paper{
    width:100%;
    max-width: 480px;
    background: var(--ledger);
    border: 1px solid var(--ledger-line);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    position:relative;
  }
  .paper::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:6px;
    background: linear-gradient(90deg, var(--gold), var(--gold-dim));
  }
  header.brand{
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--ledger-line);
    text-align:left;
  }
  header.brand .mark{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--gold-dim);
    margin-bottom: 6px;
  }
  header.brand h1{
    margin:0;
    font-size: 28px;
    font-weight: 600;
    line-height:1.15;
    color: var(--forest);
  }
  header.brand p{
    margin: 6px 0 0;
    font-size: 14px;
    color: #5b5342;
  }
  .body-area{ padding: 24px 28px 32px; }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 12px;
    font-family: var(--mono);
    text-transform: none;
    color: #5b5342;
    margin-bottom: 6px;
  }
  .field input, .field select{
    width:100%;
    padding: 11px 12px;
    font-size: 16px;
    font-family: var(--serif);
    border: 1px solid var(--ledger-line);
    background: #FBF8EF;
    color: var(--ink);
    border-radius: 2px;
  }
  .field input:focus, .field select:focus{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  .hint{ font-size: 12.5px; color: #7a7360; margin-top: 6px; }
  button{
    font-family: var(--serif);
    cursor: pointer;
    border: none;
    border-radius: 2px;
  }
  .btn-primary{
    width:100%;
    padding: 13px 16px;
    background: var(--forest);
    color: #F4EFE1;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .btn-primary:hover{ background: var(--forest-2); }
  .btn-primary:disabled{ opacity: 0.5; cursor: default; }
  .btn-ghost{
    width:100%;
    padding: 12px 16px;
    background: transparent;
    color: var(--forest);
    border: 1px solid var(--ledger-line);
    font-size: 14.5px;
  }
  .btn-ghost:hover{ background: rgba(0,0,0,0.03); }
  .btn-link{
    background:none; border:none; padding:0;
    color: var(--gold-dim);
    text-decoration: underline;
    font-size: 13.5px;
    font-family: var(--serif);
  }
  .stack > * + *{ margin-top: 10px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .error-msg{
    background: rgba(140,74,58,0.10);
    border: 1px solid rgba(140,74,58,0.35);
    color: var(--red);
    font-size: 13.5px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: 2px;
  }
  .success-msg{
    background: rgba(61,107,79,0.10);
    border: 1px solid rgba(61,107,79,0.35);
    color: var(--green-pos);
    font-size: 13.5px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: 2px;
  }
  /* Dashboard */
  .acct-strip{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 18px 28px;
    border-bottom: 1px solid var(--ledger-line);
    background: #EDE6D2;
  }
  .acct-strip .who{ font-size:14px; }
  .acct-strip .who b{ color: var(--forest); }
  .acct-strip .num{ font-family: var(--mono); font-size: 12.5px; color:#7a7360; }
  .balance-block{
    padding: 26px 28px 10px;
    text-align:left;
  }
  .balance-block .label{
    font-family: var(--mono);
    font-size: 11.5px;
    color: #8a8267;
    margin-bottom: 4px;
  }
  .balance-block .amount{
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 600;
    color: var(--forest);
    line-height:1;
  }
  .sub-balances{
    display:flex;
    gap: 18px;
    padding: 16px 28px 6px;
    border-bottom: 1px solid var(--ledger-line);
  }
  .sub-balances .item{ flex:1; }
  .sub-balances .item .l{ font-family: var(--mono); font-size:10.5px; color:#8a8267; }
  .sub-balances .item .v{ font-family: var(--mono); font-size:17px; color: var(--ink); margin-top:2px; }
  .grid-actions{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--ledger-line);
    border-top: 1px solid var(--ledger-line);
    border-bottom: 1px solid var(--ledger-line);
  }
  .grid-actions button{
    background: var(--ledger);
    padding: 16px 6px;
    font-size: 12.5px;
    color: var(--forest);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .grid-actions button:hover{ background: #EDE6D2; }
  .grid-actions .ic{ font-size: 18px; }
  .panel{
    padding: 22px 28px 26px;
  }
  .panel h2{
    font-size: 17px;
    margin: 0 0 14px;
    color: var(--forest);
  }
  .tx-list{
    font-family: var(--mono);
    font-size: 12.8px;
    max-height: 320px;
    overflow-y:auto;
  }
  .tx-row{
    display:flex;
    justify-content:space-between;
    padding: 9px 0;
    border-bottom: 1px dashed var(--ledger-line);
    gap: 10px;
  }
  .tx-row .desc{ color:#4a4636; flex:1; }
  .tx-row .amt.pos{ color: var(--green-pos); }
  .tx-row .amt.neg{ color: var(--red); }
  .tx-id{ color:#a49a7d; margin-right:8px; }
  .footer-nav{
    padding: 14px 28px 26px;
  }
  .badge{
    display:inline-block;
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:0.04em;
    padding: 4px 9px;
    border-radius: 100px;
    border: 1px solid var(--gold-dim);
    color: var(--gold-dim);
  }
  .divider{ height:1px; background:var(--ledger-line); margin: 18px 0; }
  .welcome-hero{
    padding: 46px 28px 30px;
    text-align:left;
  }
  .welcome-hero .mark{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold-dim);
    letter-spacing: 0.08em;
  }
  .welcome-hero h1{
    font-size: 34px;
    margin: 10px 0 8px;
    color: var(--forest);
    line-height: 1.1;
  }
  .welcome-hero p{
    font-size: 15px;
    color: #5b5342;
    max-width: 34ch;
    margin: 0;
  }
  .stat-line{
    font-family: var(--mono);
    font-size: 12px;
    color: #8a8267;
    padding: 0 28px 22px;
  }
  a.silent{ color:inherit; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--ledger-line); border-radius:4px; }
  @media (max-width: 420px){
    .balance-block .amount{ font-size: 32px; }
    .grid-actions{ grid-template-columns: repeat(3,1fr); }
  }
</style>
</head>
<body>
<div class="paper" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyAeLyV-jrgpqkgaR06y8NEGeGJvY8eA0jY",
    authDomain: "bank-system-6952d.firebaseapp.com",
    projectId: "bank-system-6952d",
    storageBucket: "bank-system-6952d.firebasestorage.app",
    messagingSenderId: "707679493353",
    appId: "1:707679493353:web:74eb92e4ad36cd7d526478",
    measurementId: "G-Y76J1WP6MX"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const ACCOUNTS_COL = db.collection("bank_accounts");
  const MARKET_DOC = db.collection("bank_meta").doc("market");

  // ---------- Stock Market ----------
  const STOCKS = [
    { symbol: "GLDX", name: "Goldwell Exports" },
    { symbol: "TCHN", name: "Techna Systems" },
    { symbol: "OILR", name: "Oilridge Co" },
    { symbol: "FARM", name: "Farmstead Group" },
    { symbol: "CRYP", name: "CryptoNova" }
  ];
  let market = { prices: {}, rigged: {} };
  let marketTimer = null;

  function defaultMarket(){
    const prices = {}, rigged = {};
    STOCKS.forEach(s => { prices[s.symbol] = Math.round((20 + Math.random()*180) * 100) / 100; rigged[s.symbol] = null; });
    return { prices, rigged };
  }

  async function loadMarket(){
    try{
      const snap = await MARKET_DOC.get();
      if (snap.exists && snap.data().prices){
        const d = snap.data();
        market = { prices: d.prices || {}, rigged: d.rigged || {} };
      }else{
        market = defaultMarket();
        await MARKET_DOC.set(market);
      }
    }catch(e){
      market = defaultMarket();
    }
  }

  async function saveMarket(){
    try{
      await MARKET_DOC.set(market);
    }catch(e){
      // best-effort
    }
  }

  function watchMarket(){
    MARKET_DOC.onSnapshot((snap) => {
      if (!snap.exists) return;
      const d = snap.data();
      market = { prices: d.prices || {}, rigged: d.rigged || {} };
      if (screen === "dashboard" && dashPanel === "market") render();
      if (screen === "admin" && adminView === "market") render();
    });
  }

  function tickMarket(){
    STOCKS.forEach(s => {
      const rig = market.rigged[s.symbol];
      if (rig !== null && rig !== undefined && rig !== ""){
        market.prices[s.symbol] = Number(rig);
      }else{
        const cur = market.prices[s.symbol] || 50;
        const pct = (Math.random() - 0.5) * 0.12; // up to ±6% per tick
        let next = cur * (1 + pct);
        if (next < 1) next = 1;
        market.prices[s.symbol] = Math.round(next * 100) / 100;
      }
    });
    saveMarket();
  }

  function startMarketTimer(){
    if (marketTimer) return;
    marketTimer = setInterval(tickMarket, 10000);
  }

  // ---------- Auctions ----------
  const AUCTIONS_DOC = db.collection("bank_meta").doc("auctions");
  let auctions = [];
  let lastAutoPostAt = 0;
  let auctionTimer = null;

  // Pool the system posts from automatically, so the marketplace never sits empty.
  const AUTO_ITEM_POOL = [
    { name: "Vintage Watch", min: 50, max: 300 },
    { name: "Rare Comic Book", min: 20, max: 150 },
    { name: "Antique Vase", min: 80, max: 400 },
    { name: "Signed Guitar", min: 200, max: 800 },
    { name: "Gold Coin", min: 100, max: 500 },
    { name: "Diamond Ring", min: 500, max: 2000 },
    { name: "Classic Painting", min: 300, max: 1500 },
    { name: "Limited Sneakers", min: 60, max: 250 },
    { name: "Mystery Crate", min: 30, max: 200 },
    { name: "Vintage Motorcycle", min: 1000, max: 4000 }
  ];
  const AUTO_TARGET_ACTIVE = 3;   // system tries to keep this many auctions live
  const AUTO_COOLDOWN_MS = 20000; // don't post more than once every 20s

  async function loadAuctions(){
    try{
      const snap = await AUCTIONS_DOC.get();
      const d = snap.exists ? snap.data() : null;
      auctions = (d && Array.isArray(d.items)) ? d.items : [];
      lastAutoPostAt = (d && d.lastAutoPostAt) ? d.lastAutoPostAt : 0;
    }catch(e){
      auctions = [];
    }
  }

  async function saveAuctions(){
    try{
      await AUCTIONS_DOC.set({ items: auctions, lastAutoPostAt });
    }catch(e){
      // best-effort
    }
  }

  function watchAuctions(){
    AUCTIONS_DOC.onSnapshot((snap) => {
      if (!snap.exists) return;
      const d = snap.data();
      auctions = Array.isArray(d.items) ? d.items : [];
      lastAutoPostAt = d.lastAutoPostAt || 0;
      if (screen === "dashboard" && dashPanel === "auctions") render();
      if (screen === "admin" && adminView === "auctions") render();
    });
  }

  function newAuctionId(){
    return "a" + Date.now() + Math.floor(Math.random()*1000);
  }

  async function settleAuctionsIfDue(){
    let changed = false;
    for (const auc of auctions){
      if (!auc.settled && Date.now() >= auc.endTime){
        auc.settled = true;
        changed = true;
        if (auc.bidderNum && accounts[auc.bidderNum]){
          const winner = accounts[auc.bidderNum];
          winner.balance -= auc.currentBid;
          if (!winner.collectibles) winner.collectibles = [];
          winner.collectibles.push({ name: auc.item, price: auc.currentBid });
          pushTx(winner, "Won auction: " + auc.item, -auc.currentBid);
          await persistAccount(auc.bidderNum);
        }
      }
    }
    if (changed) await saveAuctions();
  }

  async function autoPostIfNeeded(){
    const now = Date.now();
    const activeCount = auctions.filter(a => !a.settled && a.endTime > now).length;
    if (activeCount >= AUTO_TARGET_ACTIVE) return;
    if (now - lastAutoPostAt < AUTO_COOLDOWN_MS) return;
    const pick = AUTO_ITEM_POOL[Math.floor(Math.random() * AUTO_ITEM_POOL.length)];
    const startPrice = Math.round((pick.min + Math.random() * (pick.max - pick.min)) * 100) / 100;
    const minutes = 2 + Math.random() * 3; // 2–5 minutes
    auctions.push({
      id: newAuctionId(), item: pick.name, startPrice,
      currentBid: null, bidderNum: null, bidderName: null, autoBids: {},
      endTime: now + minutes * 60000, settled: false, auto: true
    });
    lastAutoPostAt = now;
    await saveAuctions();
  }

  async function auctionTick(){
    await settleAuctionsIfDue();
    await autoPostIfNeeded();
    if (screen === "dashboard" && dashPanel === "auctions") render();
    if (screen === "admin" && adminView === "auctions") render();
  }

  function startAuctionTimer(){
    if (auctionTimer) return;
    auctionTimer = setInterval(auctionTick, 5000);
  }

  // ---------- Storage ----------
  // Each account is its own document, so one write can never wipe out
  // another account that was created or changed around the same time.
  let accounts = {};

  async function loadAccounts(){
    try{
      const snap = await ACCOUNTS_COL.get();
      accounts = {};
      snap.forEach(doc => { accounts[doc.id] = doc.data(); });
    }catch(e){
      accounts = {};
    }
  }

  async function persistAccount(accNum){
    try{
      await ACCOUNTS_COL.doc(accNum).set(accounts[accNum]);
    }catch(e){
      // best-effort; keep working in memory
    }
  }

  async function deleteAccountDoc(accNum){
    try{
      await ACCOUNTS_COL.doc(accNum).delete();
    }catch(e){
      // best-effort
    }
  }

  function watchAccounts(){
    ACCOUNTS_COL.onSnapshot((snap) => {
      snap.docChanges().forEach(change => {
        if (change.type === "removed"){
          delete accounts[change.doc.id];
          if (currentAccountNumber === change.doc.id) logout();
        }else{
          accounts[change.doc.id] = change.doc.data();
        }
      });
      render();
    });
  }

  // Account 59 is permanently an admin account, no matter what. Beyond that,
  // any account can be granted or revoked admin access from inside the panel.
  const PERMANENT_ADMIN = "59";
  function isAccountAdmin(accNum){
    return accNum === PERMANENT_ADMIN || !!(accounts[accNum] && accounts[accNum].isAdmin);
  }

  // ---------- App State ----------
  let screen = "welcome"; // welcome | create | login | dashboard | admin
  let currentAccountNumber = null;
  let dashPanel = null; // which action panel is open
  let message = null; // {type:'error'|'success', text}
  let loginAttempts = 0;
  let adminView = null; // null (list) | 'edit' | 'create' | 'pin' | 'market' | 'auctions' | 'access'
  let adminSelected = null;

  function setMessage(type, text){ message = { type, text }; }
  function clearMessage(){ message = null; }

  function fmt(n){
    const num = Math.round(n * 100) / 100;
    return (num < 0 ? "-" : "") + Math.abs(num).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:2});
  }

  function newAccountNumber(){
    let n;
    do{
      n = String(Math.floor(Math.random()*90)+10);
    }while(accounts[n]);
    return n;
  }

  function nextTx(acct){
    acct.transaction_number += 1;
    return "TX" + acct.transaction_number;
  }

  function pushTx(acct, desc, amount){
    const sign = amount >= 0 ? "+" : "-";
    acct.transactions.unshift(nextTx(acct) + " | " + desc + " | " + sign + fmt(Math.abs(amount)));
  }

  function todayStr(){
    return new Date().toISOString().slice(0,10); // YYYY-MM-DD
  }

  // Salary now pays out once per login (not on a timer), and savings earn
  // a flat 1% once per calendar day, also checked at login time.
  function applyLoginBonuses(acct){
    const notes = [];
    if (acct.income > 0){
      acct.balance += acct.income;
      acct.rewards += 1;
      pushTx(acct, "Salary (" + acct.profession + ")", acct.income);
      notes.push("Salary of " + fmt(acct.income) + " paid.");
    }
    const today = todayStr();
    if (acct.savings > 0 && acct.lastSavingsDate !== today){
      const interest = Math.round(acct.savings * 0.01 * 100) / 100;
      acct.savings += interest;
      pushTx(acct, "Daily savings interest (1%)", interest);
      notes.push("Savings earned " + fmt(interest) + " interest.");
    }
    acct.lastSavingsDate = today;
    return notes;
  }

  // ---------- Actions ----------
  function goWelcome(){ screen = "welcome"; dashPanel=null; clearMessage(); render(); }
  function goCreate(){ screen = "create"; clearMessage(); render(); }
  function goLogin(){ screen = "login"; loginAttempts = 0; clearMessage(); render(); }

  async function doCreate(name, pin){
    clearMessage();
    if (!name.trim()){ setMessage("error","Enter your name."); render(); return; }
    if (!/^\d{4}$/.test(pin)){ setMessage("error","PIN must be exactly 4 digits."); render(); return; }
    if (Object.keys(accounts).length >= 90){ setMessage("error","No more account numbers are available."); render(); return; }
    const accNum = newAccountNumber();
    accounts[accNum] = {
      name: name.trim(), balance: 0, savings: 0, loan: 0, pin,
      rewards: 0, transactions: [], transaction_number: 1000,
      income: 0, profession: "", portfolio: {}, houses: [], collectibles: [],
      fixedDeposit: null, lastSavingsDate: todayStr(), isAdmin: false
    };
    const acct = accounts[accNum];
    acct.balance -= 200;
    pushTx(acct, "Account creation fee", -200);
    await persistAccount(accNum);
    currentAccountNumber = accNum;
    screen = "dashboard"; dashPanel = null;
    setMessage("success", "Account created. Your account number is " + accNum + " — keep it safe.");
    render();
  }

  async function doLogin(accNum, pin){
    clearMessage();
    if (!accounts[accNum]){ setMessage("error","Account not found."); render(); return; }
    if (accounts[accNum].pin === pin){
      currentAccountNumber = accNum;
      screen = "dashboard"; dashPanel = null;
      loginAttempts = 0;
      const notes = applyLoginBonuses(accounts[accNum]);
      await persistAccount(accNum);
      if (notes.length) setMessage("success", notes.join(" "));
      render();
    }else{
      loginAttempts += 1;
      if (loginAttempts >= 3){
        setMessage("error","Too many incorrect PIN attempts. Account locked for this session.");
        screen = "welcome";
      }else{
        setMessage("error","Incorrect PIN. " + (3-loginAttempts) + " attempt(s) left.");
      }
      render();
    }
  }

  function logout(){
    currentAccountNumber = null;
    screen = "welcome"; dashPanel = null;
    clearMessage();
    render();
  }

  function openPanel(p){ dashPanel = p; clearMessage(); render(); }
  function closePanel(){ dashPanel = null; clearMessage(); render(); }

  async function doWithdraw(amountStr){
    const acct = accounts[currentAccountNumber];
    const amount = parseFloat(amountStr);
    if (isNaN(amount) || amount <= 0){ setMessage("error","Enter a valid amount."); render(); return; }
    if (amount > 500){ setMessage("error","Maximum withdrawal is 500."); render(); return; }
    if (amount > acct.balance){ setMessage("error","Insufficient funds."); render(); return; }
    acct.balance -= amount;
    acct.rewards += 1;
    pushTx(acct, "Withdrawal", -amount);
    await persistAccount(currentAccountNumber);
    setMessage("success", "Withdrew " + fmt(amount) + ". New balance: " + fmt(acct.balance));
    dashPanel = null; render();
  }

  async function doDeposit(amountStr){
    const acct = accounts[currentAccountNumber];
    const amount = parseFloat(amountStr);
    if (isNaN(amount) || amount <= 0){ setMessage("error","Enter a valid amount."); render(); return; }
    if (amount > 500){ setMessage("error","Maximum deposit is 500."); render(); return; }
    acct.balance += amount;
    acct.rewards += 1;
    pushTx(acct, "Deposit", amount);
    await persistAccount(currentAccountNumber);
    setMessage("success", "Deposited " + fmt(amount) + ". New balance: " + fmt(acct.balance));
    dashPanel = null; render();
  }

  async function doTransfer(receiver, amountStr){
    const acct = accounts[currentAccountNumber];
    const amount = parseFloat(amountStr);
    if (!accounts[receiver]){ setMessage("error","Receiver account does not exist."); render(); return; }
    if (receiver === currentAccountNumber){ setMessage("error","You cannot transfer money to yourself."); render(); return; }
    if (isNaN(amount) || amount <= 0){ setMessage("error","Enter a valid amount."); render(); return; }
    if (amount > acct.balance){ setMessage("error","Insufficient funds."); render(); return; }
    acct.balance -= amount;
    acct.rewards += 2;
    pushTx(acct, "Transfer to " + receiver, -amount);
    const recv = accounts[receiver];

  async function doMarketBuy(symbol, qtyStr){
    const acct = accounts[currentAccountNumber];
    const qty = parseInt(qtyStr, 10);
    const price = market.prices[symbol];
    if (!price){ setMessage("error","Unknown stock."); render(); return; }
    if (isNaN(qty) || qty <= 0){ setMessage("error","Enter a valid quantity."); render(); return; }
    const cost = Math.round(qty * price * 100) / 100;
    if (cost > acct.balance){ setMessage("error","Insufficient funds for that purchase."); render(); return; }
    if (!acct.portfolio) acct.portfolio = {};
    acct.balance -= cost;
    acct.portfolio[symbol] = (acct.portfolio[symbol] || 0) + qty;
    pushTx(acct, "Bought " + qty + " " + symbol + " @ " + fmt(price), -cost);
    await persistAccount(currentAccountNumber);
    setMessage("success", "Bought " + qty + " shares of " + symbol + " for " + fmt(cost) + ".");
    render();
  }

  async function doMarketSell(symbol, qtyStr){
    const acct = accounts[currentAccountNumber];
    const qty = parseInt(qtyStr, 10);
    const price = market.prices[symbol];
    if (!acct.portfolio) acct.portfolio = {};
    const held = acct.portfolio[symbol] || 0;
    if (isNaN(qty) || qty <= 0){ setMessage("error","Enter a valid quantity."); render(); return; }
    if (qty > held){ setMessage("error","You only hold " + held + " shares of " + symbol + "."); render(); return; }
    const proceeds = Math.round(qty * price * 100) / 100;
    acct.balance += proceeds;
    acct.portfolio[symbol] = held - qty;
    if (acct.portfolio[symbol] === 0) delete acct.portfolio[symbol];
    pushTx(acct, "Sold " + qty + " " + symbol + " @ " + fmt(price), proceeds);
    await persistAccount(currentAccountNumber);
    setMessage("success", "Sold " + qty + " shares of " + symbol + " for " + fmt(proceeds) + ".");
    render();
  }

  function netWorth(acct){
    let worth = (acct.balance || 0) + (acct.savings || 0) - (acct.loan || 0);
    const portfolio = acct.portfolio || {};
    Object.keys(portfolio).forEach(sym => { worth += (market.prices[sym] || 0) * portfolio[sym]; });
    (acct.houses || []).forEach(h => { worth += h.price; });
    (acct.collectibles || []).forEach(c => { worth += c.price; });
    if (acct.fixedDeposit) worth += acct.fixedDeposit.amount;
    return Math.round(worth * 100) / 100;
  }

  // ---------- Bidding (auto-bid wars) ----------
  // Each bidder sets a private maximum. The system automatically resolves the
  // visible price to just above the second-highest maximum, so competing
  // auto-bids drive the price up on their own — a classic proxy "bid war."
  const BID_INCREMENT_PCT = 0.03; // each round the price climbs ~3% past the runner-up's max

  function resolveAuction(auc){
    const entries = Object.keys(auc.autoBids || {})
      .map(num => ({ num, max: auc.autoBids[num] }))
      .filter(e => e.max > 0);
    if (entries.length === 0){
      auc.currentBid = null; auc.bidderNum = null; auc.bidderName = null;
      return;
    }
    entries.sort((a,b) => b.max - a.max);
    const top = entries[0];
    const second = entries[1];
    const increment = Math.max(1, Math.round(auc.startPrice * BID_INCREMENT_PCT * 100) / 100);
    let bid;
    if (second){
      bid = Math.min(top.max, Math.round((second.max + increment) * 100) / 100);
    }else{
      bid = auc.startPrice;
    }
    auc.currentBid = bid;
    auc.bidderNum = top.num;
    auc.bidderName = accounts[top.num] ? accounts[top.num].name : "Unknown";
  }

  async function doSetAutoBid(auctionId, maxStr){
    const acct = accounts[currentAccountNumber];
    const auc = auctions.find(a => a.id === auctionId);
    if (!auc || auc.settled || Date.now() >= auc.endTime){ setMessage("error","That auction has closed."); render(); return; }
    const max = parseFloat(maxStr);
    if (isNaN(max) || max <= 0){ setMessage("error","Enter a valid maximum bid."); render(); return; }
    if (max < auc.startPrice){ setMessage("error","Your maximum must be at least the starting price of " + fmt(auc.startPrice) + "."); render(); return; }
    if (max > acct.balance){ setMessage("error","Your maximum can't be more than your balance (" + fmt(acct.balance) + ")."); render(); return; }
    if (!auc.autoBids) auc.autoBids = {};
    auc.autoBids[currentAccountNumber] = max;
    resolveAuction(auc);
    await saveAuctions();
    if (auc.bidderNum === currentAccountNumber){
      setMessage("success", "You're leading \"" + auc.item + "\" at " + fmt(auc.currentBid) + " (your max: " + fmt(max) + ").");
    }else{
      setMessage("success", "Max bid of " + fmt(max) + " set — but someone else's max is currently higher on \"" + auc.item + "\".");
    }
    render();
  }

                </div>

            </div>

          <div class="footer-nav" style="padding-left:0;padding-right:0;"><button class="btn-ghost" id="btn-cancel">Close</button></div>
        </div>
      `;

  function panelForm(title, fields, submitLabel, onSubmit){
    const fieldsHtml = fields.map((f,i) => `
      <div class="field">
        <label>${escapeHtml(f.label)}</label>
        <input type="${f.type || 'text'}" id="pf-${i}" ${f.numeric ? 'inputmode="decimal"' : ''} placeholder="${escapeHtml(f.placeholder||'')}" ${f.attrs||''} />
        ${f.hint ? `<div class="hint">${escapeHtml(f.hint)}</div>` : ""}
      </div>
    `).join("");
    return `
      <div class="panel">
        <h2>${escapeHtml(title)}</h2>
        ${messageHtml()}
        ${fieldsHtml}
        <div class="stack">
          <button class="btn-primary" id="panel-submit">${escapeHtml(submitLabel)}</button>
          <button class="btn-ghost" id="panel-cancel">Cancel</button>
        </div>
      </div>
    `;
  }

  function wirePanel(fields, onSubmit){
    app.querySelector("#panel-submit").onclick = () => {
      const values = fields.map((f,i) => app.querySelector("#pf-"+i).value);
      onSubmit(...values);
    };
    app.querySelector("#panel-cancel").onclick = closePanel;
  }

                </div>
                ${soldOut
                  ? `<span class="badge" style="color:var(--red); border-color:rgba(140,74,58,0.4);">SOLD OUT</span>`
                  : `
                    <button class="btn-ghost" style="width:auto; padding:8px 10px; font-size:12.5px;" data-house-cash="${i}">Pay cash</button>
                    <button class="btn-ghost" style="width:auto; padding:8px 10px; font-size:12.5px;" data-house-points="${i}">Pay ${h.price} pts</button>
                  `}
              </div>
            `;
            }).join("")}
          </div>
          <div class="divider"></div>
          <div class="hint">You own ${owned.length} propert${owned.length===1?'y':'ies'}${owned.length ? ": " + owned.map(h=>escapeHtml(h.name)).join(", ") : ""}.</div>
          <div class="footer-nav" style="padding-left:0;padding-right:0;"><button class="btn-ghost" id="panel-cancel">Close</button></div>
        </div>
      `;
      wire = () => {
        app.querySelectorAll("[data-house-cash]").forEach(b => b.onclick = () => {
          const h = HOUSES[parseInt(b.getAttribute("data-house-cash"),10)];
          doBuyHouse(h.name, h.price, "cash");
        });
        app.querySelectorAll("[data-house-points]").forEach(b => b.onclick = () => {
          const h = HOUSES[parseInt(b.getAttribute("data-house-points"),10)];
          doBuyHouse(h.name, h.price, "points");
        });
        app.querySelector("#panel-cancel").onclick = closePanel;
      };
    } else if (dashPanel === "fd"){
      const fd = acct.fixedDeposit;
      const matured = fdIsMatured(fd);
      panelHtml = `
        <div class="panel">
          <h2>Fixed deposit</h2>
          <div class="hint" style="margin-bottom:12px;">Locks exactly ${fmt(FD_AMOUNT)} for ${FD_MATURE_DAYS} day, matures to ${fmt(FD_RETURN)}.</div>
          ${messageHtml()}
          ${fd ? `
            <div style="font-family:var(--mono); font-size:14px;">
              <div>Amount locked — ${fmt(fd.amount)}</div>
              <div>Opened — ${fd.startDate}</div>
              <div>Status — ${matured ? '<span class="badge">MATURED</span>' : 'Still maturing'}</div>
            </div>
            <div class="stack" style="margin-top:14px;">
              <button class="btn-primary" id="fd-redeem" ${matured ? '' : 'disabled'}>Redeem for ${fmt(FD_RETURN)}</button>
            </div>
          ` : `
            <div class="stack">
              <button class="btn-primary" id="fd-open">Open fixed deposit (${fmt(FD_AMOUNT)})</button>
            </div>
          `}
          <div class="footer-nav" style="padding-left:0;padding-right:0;"><button class="btn-ghost" id="panel-cancel">Close</button></div>
        </div>
      `;
      wire = () => {
        if (fd){ const el = app.querySelector("#fd-redeem"); if (el) el.onclick = doRedeemFD; }
        else { app.querySelector("#fd-open").onclick = doOpenFD; }
        app.querySelector("#panel-cancel").onclick = closePanel;
      };
    } else if (dashPanel === "leaderboard"){
      const ranked = Object.keys(accounts).map(n => ({ n, a: accounts[n], w: netWorth(accounts[n]) })).sort((x,y) => y.w - x.w);
      panelHtml = `
        <div class="panel">
          <h2>Leaderboard</h2>
          <div class="hint" style="margin-bottom:12px;">Ranked by net worth: cash + savings + investments + property − loans.</div>
          <div class="tx-list">
            ${ranked.map((r, i) => `
              <div class="tx-row" style="align-items:center;">
                <div class="desc"><span class="tx-id">#${i+1}</span>${escapeHtml(r.a.name)} ${r.n === currentAccountNumber ? '<span class="badge">YOU</span>' : ''}</div>
                <div class="amt pos">${fmt(r.w)}</div>
              </div>
            `).join("")}
          </div>
          <div class="footer-nav" style="padding-left:0;padding-right:0;"><button class="btn-ghost" id="panel-cancel">Close</button></div>
        </div>
      `;
      wire = () => { app.querySelector("#panel-cancel").onclick = closePanel; };
    } else if (dashPanel === "auctions"){
      const now = Date.now();
      const active = auctions.filter(a => !a.settled && a.endTime > now).sort((x,y) => x.endTime - y.endTime);
      const ended = auctions.filter(a => a.settled).sort((x,y) => y.endTime - x.endTime).slice(0, 5);
      function timeLeft(ms){
        const s = Math.max(0, Math.round((ms - now)/1000));
        const m = Math.floor(s/60), r = s%60;
        return m + "m " + (r<10?"0":"") + r + "s";
      }
      panelHtml = `
        <div class="panel">
          <h2>Live auctions</h2>
          <div class="hint" style="margin-bottom:12px;">Balance: ${fmt(acct.balance)} &middot; Set your max — we auto-bid for you and fight it out with anyone else's max.</div>
          ${messageHtml()}
          ${active.length === 0 ? '<div class="hint">No active auctions right now.</div>' : active.map(a => {
            const minBid = a.currentBid != null ? a.currentBid : a.startPrice;
            const bidderCount = Object.keys(a.autoBids || {}).length;
            const myMax = (a.autoBids || {})[currentAccountNumber];
            const iAmLeading = a.bidderNum === currentAccountNumber;
            return `
              <div class="field" style="border-bottom:1px dashed var(--ledger-line); padding-bottom:14px;">
                <label>${escapeHtml(a.item)} ${iAmLeading ? '<span class="badge" style="margin-left:6px;">YOU LEAD</span>' : ''}</label>
                <div class="hint" style="margin-bottom:6px;">
                  Current price: ${fmt(minBid)}${a.bidderName ? " — leading: " + escapeHtml(a.bidderName) : " (no bids yet)"} &middot; ${bidderCount} bidder${bidderCount===1?'':'s'} &middot; ${timeLeft(a.endTime)} left
                  ${myMax ? " &middot; your max: " + fmt(myMax) : ""}
                </div>
                <div class="row">
                  <input type="number" id="bid-${a.id}" placeholder="Your max (at least ${fmt(minBid)})" />
                  <button class="btn-primary" style="flex:0 0 auto; width:auto; padding:11px 16px;" data-bid="${a.id}">Auto-bid</button>
                </div>
              </div>
            `;
          }).join("")}
          ${ended.length ? `
            <div class="divider"></div>
            <div class="hint" style="margin-bottom:8px;">Recently settled</div>
            <div class="tx-list">
              ${ended.map(a => `
                <div class="tx-row">
                  <div class="desc">${escapeHtml(a.item)}</div>
                  <div class="amt pos">${a.bidderName ? escapeHtml(a.bidderName) + " — " + fmt(a.currentBid) : "No winner"}</div>
                </div>
              `).join("")}
            </div>
          ` : ""}
          <div class="footer-nav" style="padding-left:0;padding-right:0;"><button class="btn-ghost" id="panel-cancel">Close</button></div>
        </div>
      `;
      wire = () => {
        app.querySelectorAll("[data-bid]").forEach(b => b.onclick = () => {
          const id = b.getAttribute("data-bid");
          doSetAutoBid(id, app.querySelector("#bid-" + id).value);
        });
        app.querySelector("#panel-cancel").onclick = closePanel;
      };
    }

    app.innerHTML = `
      <div class="acct-strip">
        <div class="who">Welcome, <b>${escapeHtml(acct.name)}</b></div>
        <div class="num">ACCT ${currentAccountNumber}</div>
      </div>
      ${!dashPanel ? `
        <div class="balance-block">
          <div class="label">CURRENT BALANCE</div>
          <div class="amount">${fmt(acct.balance)}</div>
        </div>
        <div class="sub-balances">
          <div class="item"><div class="l">SAVINGS</div><div class="v">${fmt(acct.savings)}</div></div>
          <div class="item"><div class="l">LOAN</div><div class="v">${fmt(acct.loan)}</div></div>
          <div class="item"><div class="l">REWARDS</div><div class="v">${acct.rewards} pt</div></div>
        </div>
        ${messageHtml() ? `<div style="padding:14px 28px 0;">${messageHtml()}</div>` : ""}
        <div class="grid-actions">
          <button data-p="withdraw"><span class="ic">&#8595;</span>Withdraw</button>
          <button data-p="deposit"><span class="ic">&#8593;</span>Deposit</button>
          <button data-p="transfer"><span class="ic">&#8644;</span>Transfer</button>
          <button data-p="savingsDeposit"><span class="ic">&#128176;</span>Save</button>
          <button data-p="savingsWithdraw"><span class="ic">&#8617;</span>Unsave</button>
          <button data-p="interest"><span class="ic">%</span>Interest</button>
          <button data-p="salary"><span class="ic">&#128188;</span>Salary</button>
          <button data-p="loan"><span class="ic">&#128179;</span>Loan</button>
          <button data-p="repay"><span class="ic">&#8617;</span>Repay</button>
          <button data-p="rewards"><span class="ic">&#9733;</span>Rewards</button>
          <button data-p="market"><span class="ic">&#128200;</span>Market</button>
          <button data-p="spend"><span class="ic">&#128722;</span>Spend</button>
          <button data-p="houses"><span class="ic">&#127968;</span>Houses</button>
          <button data-p="fd"><span class="ic">&#128274;</span>Fixed Dep.</button>
          <button data-p="leaderboard"><span class="ic">&#127942;</span>Leaderboard</button>
          <button data-p="auctions"><span class="ic">&#128276;</span>Auctions</button>
          <button data-p="history"><span class="ic">&#8801;</span>History</button>
          <button data-p="statement"><span class="ic">&#128203;</span>Statement</button>
        </div>
        <div class="panel" style="padding-bottom:0;">
          <h2 style="margin-bottom:8px;">Recent activity</h2>
          ${renderTxList(acct.transactions.slice(0,5))}
        </div>
        <div class="footer-nav">
          ${isAccountAdmin(currentAccountNumber) ? `
            <button class="btn-primary" id="btn-goadmin" style="margin-bottom:10px;">&#128737; Admin panel</button>
          ` : ""}
          <div class="row">
            <button class="btn-ghost" id="btn-pin">Change PIN</button>
            <button class="btn-ghost" id="btn-logout">Log out</button>
          </div>
        </div>
      ` : panelHtml}
    `;

    if (!dashPanel){
      app.querySelectorAll(".grid-actions button").forEach(b => {
        b.onclick = () => openPanel(b.getAttribute("data-p"));
      });
      app.querySelector("#btn-pin").onclick = () => openPanel("pin");
      app.querySelector("#btn-logout").onclick = logout;
      const goAdminBtn = app.querySelector("#btn-goadmin");
      if (goAdminBtn) goAdminBtn.onclick = goAdminFromDashboard;
    } else if (wire){
      wire();
    }
  }

  function renderTxList(list){
    if (!list || list.length === 0){
      return `<div class="hint">No transactions yet.</div>`;
    }
    return `<div class="tx-list">` + list.map(t => {
      const parts = t.split(" | ");
      const id = parts[0] || "";
      const desc = parts[1] || t;
      const amtRaw = parts[2] || "";
      const isNeg = amtRaw.trim().startsWith("-");
      return `<div class="tx-row">
        <div class="desc"><span class="tx-id">${escapeHtml(id)}</span>${escapeHtml(desc)}</div>
        <div class="amt ${isNeg ? 'neg':'pos'}">${escapeHtml(amtRaw)}</div>
      </div>`;
    }).join("") + `</div>`;
  }

  function render(){
    if (screen === "welcome") renderWelcome();
    else if (screen === "create") renderCreate();
    else if (screen === "login") renderLogin();
    else if (screen === "dashboard") renderDashboard();
    else if (screen === "admin") renderAdmin();
  }

  // ---------- Boot ----------
  async function boot(){
    app.innerHTML = `<div class="body-area"><p>Opening the ledger…</p></div>`;
    await loadAccounts();
    await loadMarket();
    await loadAuctions();
    watchAccounts();
    watchMarket();
    watchAuctions();
    startMarketTimer();
    startAuctionTimer();
    await auctionTick();
    render();
  }

  boot();
})();
</script>
</body>
</html>
